# Custom server settings where we diverge from the upstream starter defaults

hapi:
  fhir:
    server_address: http://localhost:8080/fhir
    implementationguides:
      pdex:
        name: hl7.fhir.us.davinci-pdex
        version: 2.1.0
        fetchDependencies: false
        installMode: STORE_ONLY
        reloadExisting: true
    allowed_bundle_types: COLLECTION,DOCUMENT,MESSAGE,TRANSACTION,TRANSACTIONRESPONSE,BATCH,BATCHRESPONSE,HISTORY,SEARCHSET
    cr:
      enabled: true
    cdshooks:
      enabled: true
    enable_index_missing_fields: true
    bulk_export_enabled: true
    allow_external_references: true
    client_id_strategy: ANY
    cors:
      allow_Credentials: true
    custom-bean-packages: com.lantanagroup.pdex
    tester:
      home:
        server_address: 'https://pdex-server.davinci.hl7.org/fhir'
      global:
        name: Global Tester
        server_address: "http://hapi.fhir.org/baseR4"
        refuse_to_fetch_third_party_urls: false
        fhir_version: R4

initial-data:
  - ri_resources

security:
  enable-auth: false
  enable-proxy: false
  bypass-header: X-Allow-Public-Access
  # client-id:
  # client-secret:
  issuer: https://udap-security.fast.hl7.org
  authorization-url:
  introspection-url:
  token-url:
  patient-claim-required: false
  udap:
    security-server-base: https://udap-security.fast.hl7.org
    cert-file: classpath:cert-local-pdex-server.pfx
    cert-pass: udap-test
